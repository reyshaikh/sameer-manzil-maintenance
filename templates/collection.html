{% extends 'base.html' %}

{% block content %}

<h1>New Maintenance Collection</h1>

<div class="panel">

    <label>Select Unit</label>

    <select id="unit" name="unit">
        <option value="">Select Unit</option>

        {% for r in residents %}
        <option
            value="{{ r.UnitNo }}"
            data-owner="{{ r.OwnerName }}"
            data-mobile="{{ r.MobileNo }}"
            data-monthly="{{ r.MonthlyAmount }}"
        >
            {{ r.UnitNo }} - {{ r.OwnerName }}
        </option>
        {% endfor %}
    </select>

    <div class="info-box">

        <p>
            <strong>Owner Name:</strong>
            <span id="ownerName">-</span>
        </p>

        <p>
            <strong>Mobile Number:</strong>
            <span id="mobileNo">-</span>
        </p>

        <p>
            <strong>Monthly Amount:</strong>
            ₹<span id="monthlyAmount">0</span>
        </p>

    </div>

    <hr>

    <h3>Pending Months</h3>

    <div id="pendingMonths">
        <p>Select a unit to view pending months.</p>
    </div>

    <hr>

    <h3>Additional Charges</h3>

    {% for charge in charges %}

    <div class="charge-row">
    
        <input
            type="checkbox"
            class="chargeCheck"
            id="charge{{charge.ChargeID}}"
        >
    
        <label for="charge{{charge.ChargeID}}">
            {{ charge.ChargeName }}
        </label>
    
        <input
            type="number"
            min="0"
            placeholder="Amount"
            class="chargeAmount"
        >
    
    </div>
    
    {% endfor %}

    <hr>

    <h3>Total Amount</h3>

    <h2>
        ₹<span id="grandTotal">0</span>
    </h2>

</div>

<script>

const unit =
    document.getElementById("unit");

const ownerName =
    document.getElementById("ownerName");

const mobileNo =
    document.getElementById("mobileNo");

const monthlyAmount =
    document.getElementById("monthlyAmount");

unit.addEventListener(
    "change",
    function(){

        const o =
            this.options[
                this.selectedIndex
            ];

        ownerName.textContent =
            o.dataset.owner || "-";

        mobileNo.textContent =
            o.dataset.mobile || "-";

        monthlyAmount.textContent =
            o.dataset.monthly || "0";
    }
);

const tracker =
{{ payment_tracker|tojson }};

function calculate(){

    const monthly =
        Number(
            monthlyAmount.textContent || 0
        );

    const selectedMonths =
        document.querySelectorAll(
            'input[name="months"]:checked'
        ).length;

    const maintenance =
        monthly * selectedMonths;

    let additional = 0;

    document.querySelectorAll(
        ".chargeAmount"
    ).forEach(
        x => {
            additional += Number(
                x.value || 0
            );
        }
    );

    document.getElementById(
        "grandTotal"
    ).textContent =
        (
            maintenance +
            additional
        ).toLocaleString(
            "en-IN"
        );

}
unit.addEventListener(
    "change",
    function(){

        const o =
            this.options[
                this.selectedIndex
            ];

        ownerName.textContent =
            o.dataset.owner || "-";

        mobileNo.textContent =
            o.dataset.mobile || "-";

        monthlyAmount.textContent =
            o.dataset.monthly || "0";

        const row =
            tracker.find(
                x => String(x.UnitNo)
                === String(this.value)
            );

        const pendingDiv =
            document.getElementById(
                "pendingMonths"
            );

        if(!row){
            pendingDiv.innerHTML =
                "<p>No data found.</p>";
            return;
        }

        let html = "";

        Object.keys(row).forEach(
            month => {

                if(
                    month === "UnitNo" ||
                    month === "StartMonth"
                ){
                    return;
                }

                if(
                    !row[month]
                ){

                    html += `
                    <label>
                        <input
                            type="checkbox"
                            name="months"
                            value="${month}"
                            checked
                        >
                        ${month}
                    </label><br>
                    `;
                }

            }
        );

        pendingDiv.innerHTML =
            html || "<p>No pending months.</p>";

    }
);
</script>

{% endblock %}
