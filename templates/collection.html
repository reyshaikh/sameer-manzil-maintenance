{% extends 'base.html' %}{% block content %}<h1>New Maintenance Collection</h1><form method="post" class="panel" id="f"><label>Flat / Shop</label><select name="unit" id="unit" required><option value="">Select unit</option>{% for r in residents %}<option value="{{r.UnitNo}}" data-owner="{{r.OwnerName}}" data-mobile="{{r.MobileNo}}" data-amount="{{r.MonthlyAmount}}">{{r.UnitNo}} - {{r.OwnerName}}</option>{% endfor %}</select><div class="info" id="info">Select a unit to view pending months.</div><label>Pending Months</label><div id="months" class="months"></div><div class="total">Total: <b id="total">₹0</b></div><label>Payment Mode</label><select name="payment_mode" id="mode" required><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Cheque</option></select><div id="txnwrap"><label>Transaction / Cheque Number</label><input name="transaction_id" id="txn"></div><button class="btn" type="submit">Generate Receipt</button></form><script>const due={{due_map|tojson}};const unit=document.getElementById('unit'),months=document.getElementById('months'),info=document.getElementById('info'),total=document.getElementById('total'),mode=document.getElementById('mode'),txn=document.getElementById('txn'),txnwrap=document.getElementById('txnwrap');function redraw(){const o=unit.options[unit.selectedIndex],list=due[unit.value]||[];info.innerHTML=unit.value?`<b>${o.dataset.owner}</b><br>Mobile: ${o.dataset.mobile}<br>Monthly amount: ₹${o.dataset.amount}`:'Select a unit to view pending months.';months.innerHTML=list.length?list.map((d,i)=>`<label class="month"><input type="checkbox" name="months" value="${d.Month}" data-amount="${d.Amount}"> ${d.Month} <span>₹${d.Amount}</span></label>`).join(''):'<p>No unpaid months found.</p>';calc()}function calc(){let s=0;document.querySelectorAll('input[name=months]:checked').forEach(x=>s+=Number(x.dataset.amount));total.textContent='₹'+s.toLocaleString('en-IN')}function modeChange(){const need=mode.value!=='Cash';txnwrap.style.display=need?'block':'none';txn.required=need}unit.onchange=redraw;months.onchange=calc;mode.onchange=modeChange;modeChange();</script>{% endblock %}
