{% extends 'base.html' %}{% block content %}<h1>Pending Dues</h1><div class="tablewrap"><table><tr><th>Unit</th><th>Owner</th><th>Pending Months</th><th>Total Due</th></tr>{% for unit,g in grouped.items() %}<tr><td>{{unit}}</td><td>{{g.owner}}</td><td>{{g.months|join(', ')}}</td><td>{{money(g.total)}}</td></tr>{% else %}<tr><td colspan="4">No pending dues.</td></tr>{% endfor %}</table></div>{% endblock %}
